<title>Bandeja</title>
<!-- If the host does not add the trailing slash to a folder, /admin lands
     here: send it to /admin/ (and /app to the planner). Anything else gets a
     plain way back to the planner. -->
<script>
(function(){
  var p=location.pathname.replace(/\/+$/,"");
  if(/\/admin$/.test(p)) return location.replace(p+"/"+location.search+location.hash);
  if(/\/app$/.test(p))   return location.replace(p.replace(/\/app$/,"/")+location.search+location.hash);
})();
</script>
