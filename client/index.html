<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandeja — Padel Academy Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'%3E%3Crect width='120' height='100' rx='18' fill='%2312222B'/%3E%3Ccircle cx='60' cy='38' r='22' fill='%23E09A2B'/%3E%3Cpath d='M14 44 Q60 90 106 44' fill='none' stroke='%23E09A2B' stroke-width='13' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Order matters: the SDK bundle must load before init.js, which initialises it. -->
<script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.1/catalystWebSDK.js"></script>
<script src="/__catalyst/sdk/init.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEE9; --panel:#FFFFFF; --sunken:#F4F6F2; --line:#D7DDD4;
  --ink:#12222B; --ink2:#53646E; --honey:#E09A2B; --honeyBg:#FBF1E6; --honeyInk:#7A5210;
  --turf:#4F8A5B; --turfBg:#EAF2EB; --turfInk:#33613F;
  --alert:#BE5236; --alertBg:#FBECE7; --alertInk:#7A3420;
  --head:#12222B; --headInk:#FFFFFF; --shadow:0 1px 2px rgba(18,34,43,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171D; --panel:#16242C; --sunken:#1B2B34; --line:#283A43;
    --ink:#E7EEEA; --ink2:#94A6B0; --honeyBg:#33260F; --honeyInk:#F0C378;
    --turfBg:#1B2E22; --turfInk:#8FC79C; --alertBg:#33201A; --alertInk:#F0A48B;
    --head:#0A1218; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0E171D; --panel:#16242C; --sunken:#1B2B34; --line:#283A43;
  --ink:#E7EEEA; --ink2:#94A6B0; --honeyBg:#33260F; --honeyInk:#F0C378;
  --turfBg:#1B2E22; --turfInk:#8FC79C; --alertBg:#33201A; --alertInk:#F0A48B;
  --head:#0A1218; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;font-weight:700;margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{background:var(--head);color:var(--headInk)}
.top .wrap{padding-top:14px;padding-bottom:0}
.brandrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
/* The product mark stays quiet: the academy's own name is the headline. */
.brand{display:flex;align-items:center;gap:7px;opacity:.62;margin-bottom:3px}
.brand .wm{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;line-height:1}
.brand .by{font-size:10.5px;letter-spacing:.04em;opacity:.72;margin-left:1px}
.hmark{opacity:.55;line-height:0;flex:none}
.acadname{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1.1;display:flex;align-items:center;gap:10px}
.acadname button{background:none;border:none;color:inherit;opacity:.5;padding:2px}
.acadname button:hover{opacity:1}
.stats{display:flex;gap:18px;font-size:12px}
.stat b{display:block;font-family:'Barlow Semi Condensed',sans-serif;font-size:23px;font-weight:700}
.stat span{opacity:.6}
nav.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:12px}
nav.tabs button{white-space:nowrap;background:transparent;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:7px 12px;display:inline-flex;align-items:center;gap:7px}
nav.tabs button.on{background:#fff;color:#12222B;border-color:#fff}
.badge{background:var(--honey);color:#2A1C04;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px}
main{padding:18px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.mt{margin-top:14px}.mb{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:500}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.honey{background:var(--honey);color:#2A1C04;border-color:var(--honey)}
.btn.danger{color:var(--alert)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:5px 7px;border-color:transparent;background:transparent;color:var(--ink2)}
.btn.icon:hover{color:var(--ink);background:var(--sunken)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.inp{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
.inp:focus{outline:2px solid var(--honey);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--honey)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 9px;font-size:12.5px;background:var(--sunken);color:var(--ink2);border:1px solid transparent}
.chip.ok{background:var(--turfBg);color:var(--turfInk)}
.chip.warn{background:var(--honeyBg);color:var(--honeyInk)}
.chip.bad{background:var(--alertBg);color:var(--alertInk)}
.chip.sel{background:var(--ink);color:var(--bg)}
.chip.pick{cursor:pointer;border-color:var(--line);background:var(--panel);color:var(--ink)}
.chip.pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvl{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:#fff;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;line-height:1}
.listrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--sunken)}
.listrow+.listrow{margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--ink2);background:var(--sunken);padding:8px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2)}
/* calendar */
.cal{min-width:760px}
.calhead{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.calhead>div{padding:8px 6px;border-left:1px solid var(--line)}
.calhead>div:first-child{border-left:none}
.calbody{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.daycol{position:relative;border-left:1px solid var(--line)}
.gut{position:relative}
.gutlab{position:absolute;right:7px;font-size:11px;color:var(--ink2)}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hline.half{border-top-color:var(--sunken)}
.ev{position:absolute;border-radius:9px;color:#fff;padding:3px 6px;overflow:hidden;text-align:left;border:none;box-shadow:0 1px 0 rgba(0,0,0,.14);cursor:grab;touch-action:none}
.ev.dragging{z-index:6;cursor:grabbing;opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.34);outline:2px solid var(--honey);outline-offset:1px}
.dragtip{position:fixed;z-index:98;pointer-events:none;background:var(--ink);color:var(--bg);font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;padding:4px 9px;border-radius:7px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.ev b{font-family:'Barlow Semi Condensed',sans-serif;font-size:12.5px;display:block}
.ev i{font-style:normal;font-size:11px;opacity:.92;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;margin-top:3px;align-items:center}
.pip{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;opacity:.5}
.pip.on{background:currentColor;opacity:.95;box-shadow:none}
.daycard{width:100%;text-align:left;border-radius:11px;padding:10px 12px;color:#fff;border:none;margin-bottom:8px;box-shadow:var(--shadow)}
.daycard b{font-family:'Barlow Semi Condensed',sans-serif;font-size:16px}
.daystrip{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.daystrip button{flex:1;min-width:48px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 4px;text-align:center}
.daystrip button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daystrip b{display:block;font-family:'Barlow Semi Condensed',sans-serif;font-size:14px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
@media(min-width:640px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;border:1px solid var(--line)}
@media(min-width:640px){.modal{border-radius:14px}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.drawer{max-width:430px;margin-left:auto;height:100%;border-radius:0;max-height:100vh}
@media(max-width:639px){.drawer{border-radius:14px 14px 0 0;max-height:92vh;height:auto}}
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%}
.note{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--honeyBg);color:var(--honeyInk)}
.note.bad{background:var(--alertBg);color:var(--alertInk)}
.note.info{background:var(--sunken);color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:99px;font-size:13.5px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:11px;max-width:calc(100vw - 32px)}
.toast .tundo{background:transparent;border:1px solid currentColor;color:inherit;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;flex:none}
#banner{display:none;background:var(--alertBg);color:var(--alertInk);padding:10px 16px;font-size:13.5px;border-bottom:1px solid var(--alert);position:sticky;top:0;z-index:60}
#banner.on{display:block}
#banner button{margin-left:10px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:2px 9px;font-size:12.5px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub button{border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
.sub button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hide{display:none!important}
.step{flex:none;width:25px;height:25px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);color:var(--ink2)}
.step.done{background:var(--turf);border-color:var(--turf);color:#fff}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
@media(min-width:768px){.only-m{display:none!important}}
@media(max-width:767px){.only-d{display:none!important}}
/* ── bottom tab bar: phones get a fixed bar so no tab can be cut off ── */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1 1 0;min-width:0;background:transparent;border:none;color:var(--ink2);padding:6px 2px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;position:relative}
.bottomnav button.on{color:var(--ink)}
.bottomnav button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--honey)}
.bicon{position:relative;display:block;line-height:0}
.bottomnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bdot{position:absolute;top:-5px;left:11px;background:var(--honey);color:#2A1C04;border-radius:99px;font-size:10px;font-weight:700;font-style:normal;line-height:1;padding:2px 5px;border:1.5px solid var(--panel)}
@media(min-width:768px){.bottomnav{display:none}}
@media(max-width:767px){
  /* the header used to eat half the screen before any content showed */
  .top .wrap{padding-bottom:12px}
  .brand{display:none}
  .brandrow>div:first-child{width:100%}
  .acadname{font-size:22px;gap:7px}
  .brandrow{flex-direction:column;align-items:flex-start;gap:0}
  .stats{gap:15px;margin-top:7px;font-size:11px}
  .stat b{font-size:18px}
  main{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  /* 16px stops iOS Safari zooming the page when a field takes focus */
  .inp,input,select,textarea{font-size:16px}
  .btn{min-height:42px;padding:9px 14px}
  .btn.sm{min-height:36px}
  .btn.icon{min-height:36px;min-width:36px;justify-content:center}
  .mfoot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .mfoot .btn{flex:1;justify-content:center}
  /* all seven days must fit without a sideways scroll */
  .daystrip{gap:4px}
  .daystrip button{min-width:0;padding:7px 2px}
  /* settings are glance tiles — two-up halves the scrolling */
  .gset{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="banner"></div>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div>
        <div class="brand">
          <svg viewBox="0 0 120 100" width="19" height="16" aria-hidden="true" focusable="false"><circle cx="60" cy="38" r="21" fill="currentColor"></circle><path d="M14 44 Q60 90 106 44" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"></path></svg>
          <span class="wm">BANDEJA</span><span class="by">by YLP Solutions</span>
        </div>
        <div class="acadname"><span id="acadName">—</span>
          <button data-act="editAcademy" title="Edit academy" aria-label="Edit academy name">✎</button>
          <span class="grow"></span>
          <span class="hmark only-m"><svg viewBox="0 0 120 100" width="27" height="23" role="img" aria-label="Bandeja" focusable="false"><circle cx="60" cy="38" r="21" fill="currentColor"></circle><path d="M14 44 Q60 90 106 44" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"></path></svg></span>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <nav class="tabs only-d" id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="bottomnav" id="bnav" aria-label="Sections"></nav>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";

/* ─────────── constants ─────────── */
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var DAYF=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var RAMP=["#9FBF9B","#7FB292","#5DA489","#3E9588","#2A8590","#26739B","#2C5F9E","#414A92","#5A3C84","#7A386F","#96335A"];
var DAY_START=8*60, DAY_END=22*60, ROW=22;

var DEFAULT_RULES={
  levelMin:0, levelMax:10, levelTolerance:1, classCapacity:4,
  durations:[60,90,120], minPlayersToOpen:2,
  coachCertification:{1:4,2:7,3:10}, allowUncertifiedCoach:false,
  newClassDuration:90
};

/* ─────────── state ─────────── */
var S={ academy:{name:"My Padel Academy", rules:clone(DEFAULT_RULES)},
        venues:[], coaches:[], players:[], classes:[], requests:[] };
var UI={ view:"calendar", sub:"academy", venueId:null, day:0, showFilters:false,
         filters:{minLvl:null,maxLvl:null,coachId:"",duration:"",onlyFree:false} };
var storage="off", booted=false;

function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(p){return p+Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rules(){var r=S.academy&&S.academy.rules?S.academy.rules:{};var out=clone(DEFAULT_RULES);for(var k in r)out[k]=r[k];return out;}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}

/* ─────────── time ─────────── */
function toMin(t){if(typeof t==="number")return t;var p=String(t).split(":");return (+p[0])*60+(+(p[1]||0));}
function hhmm(m){var h=Math.floor(m/60);return (h<10?"0":"")+h+":"+((m%60)<10?"0":"")+(m%60);}
function overl(aS,aD,bS,bD){return aS<bS+bD && bS<aS+aD;}
function endOf(c){return toMin(c.start)+c.duration;}

/* ─────────── level colour ─────────── */
function lvlColor(l){var r=rules();var span=Math.max(1,r.levelMax-r.levelMin);var i=Math.round((l-r.levelMin)/span*10);return RAMP[Math.max(0,Math.min(10,i))];}
function lvlTag(l,size){size=size||24;return '<span class="lvl" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.55)+'px;background:'+lvlColor(l)+'">'+fmtLvl(l)+'</span>';}
function fmtLvl(l){return (Math.round(l*10)/10).toString().replace(/\.0$/,"");}

/* ─────────── rules engine ─────────── */
function coachMax(co){var r=rules();if(!co)return r.levelMax;var v=r.coachCertification[co.certLevel];return v===undefined?r.levelMax:v;}
function capOf(c){return c.capacity||rules().classCapacity;}
function courtsInUse(venueId,day,s,dur,ignore){
  return S.classes.filter(function(c){return c.venueId===venueId&&c.day===day&&c.id!==ignore&&overl(toMin(c.start),c.duration,s,dur);}).length;
}
function coachFree(coachId,day,s,dur,ignore){
  return !S.classes.some(function(c){return c.coachId===coachId&&c.day===day&&c.id!==ignore&&overl(toMin(c.start),c.duration,s,dur);});
}
function canSchedule(k){
  var out=[],r=rules(),s=toMin(k.start);
  var v=byId(S.venues,k.venueId), co=byId(S.coaches,k.coachId);
  if(!v) out.push("Pick a club.");
  if(!co) out.push("Pick a coach.");
  if(r.durations.indexOf(k.duration)<0) out.push("This academy runs "+r.durations.join(", ")+" minute classes.");
  if(k.level<r.levelMin||k.level>r.levelMax) out.push("Level must be between "+r.levelMin+" and "+r.levelMax+".");
  if(v && courtsInUse(k.venueId,k.day,s,k.duration,k.id)>=v.courts) out.push("All "+v.courts+" courts at "+v.name+" are booked then.");
  if(co){
    if(co.venueIds&&co.venueIds.length&&co.venueIds.indexOf(k.venueId)<0) out.push(co.name+" does not work at this club.");
    if(!coachFree(k.coachId,k.day,s,k.duration,k.id)) out.push(co.name+" already teaches at that time.");
    if(k.level>coachMax(co)) out.push(co.name+" teaches up to level "+coachMax(co)+".");
  }
  return out;
}
function fit(cls,req){
  var r=rules();
  if(cls.venueId!==req.venueId) return null;
  var free=capOf(cls)-(cls.playerIds||[]).length;
  if(free<=0) return null;
  var gap=Math.abs(cls.level-req.level);
  if(gap>r.levelTolerance) return null;
  var co=byId(S.coaches,cls.coachId);
  var certified=req.level<=coachMax(co);
  if(!certified&&!r.allowUncertifiedCoach) return null;

  var reasons=[],s=toMin(cls.start),e=s+cls.duration;
  var sameDay=(req.windows||[]).filter(function(w){return w.day===cls.day;});
  var inWin=sameDay.some(function(w){return toMin(w.from)<=s&&toMin(w.to)>=e;});

  var lvlPart=1-gap/(r.levelTolerance+1);
  reasons.push({t:gap===0?"Same level ("+fmtLvl(cls.level)+")":"One level "+(cls.level>req.level?"up":"down")+", inside tolerance",k:"ok"});

  var timePart=0;
  if(inWin){timePart=1;reasons.push({t:"Inside a preferred window",k:"ok"});}
  else if(sameDay.length){timePart=.45;reasons.push({t:"Right day, outside the hours",k:"warn"});}
  else reasons.push({t:"Not a preferred day",k:"warn"});

  var cohesion=.6, mates=(cls.playerIds||[]).map(function(i){return byId(S.players,i);}).filter(Boolean);
  if(mates.length){
    var avg=mates.reduce(function(a,p){return a+p.level;},0)/mates.length;
    var d=Math.abs(avg-req.level);
    cohesion=Math.max(0,1-d/(r.levelTolerance+1));
    if(d<=.5) reasons.push({t:"Group plays at the same pace",k:"ok"});
  } else reasons.push({t:"New class, still empty",k:"ok"});

  var seatPart=free>=2?1:.6;
  if(free===1) reasons.push({t:"Last seat",k:"warn"});

  var score=Math.round((lvlPart*45+timePart*30+cohesion*15+seatPart*10));
  if(!certified){score=Math.max(0,score-25);reasons.push({t:(co?co.name:"Coach")+" teaches up to level "+coachMax(co),k:"bad"});}
  return {cls:cls,score:score,reasons:reasons,free:free};
}
function rank(req){
  return S.classes.map(function(c){return fit(c,req);}).filter(Boolean)
    .sort(function(a,b){return b.score-a.score||toMin(a.cls.start)-toMin(b.cls.start);});
}
function openRequests(){return S.requests.filter(function(r){return (r.placed||[]).length<r.sessions;});}
function formable(){
  var r=rules(),out=[],pool0=openRequests();
  S.venues.forEach(function(v){
    var pool=pool0.filter(function(x){return x.venueId===v.id;}).sort(function(a,b){return a.level-b.level;});
    var used={};
    pool.forEach(function(seed){
      if(used[seed.id])return;
      var group=pool.filter(function(x){return !used[x.id]&&Math.abs(x.level-seed.level)<=r.levelTolerance;}).slice(0,r.classCapacity);
      if(group.length<r.minPlayersToOpen)return;
      var slot=findSlot(group,v);
      if(!slot)return;
      slot.members.forEach(function(m){used[m.id]=true;});
      out.push({venue:v,day:slot.day,start:slot.start,duration:slot.duration,level:slot.level,coachId:slot.coachId,members:slot.members});
    });
  });
  return out;
}
function findSlot(group,v){
  var r=rules();
  var durs=[r.newClassDuration].concat(r.durations.filter(function(d){return d!==r.newClassDuration;}));
  for(var day=0;day<7;day++){
    var mem=group.filter(function(x){return (x.windows||[]).some(function(w){return w.day===day;});});
    if(mem.length<r.minPlayersToOpen)continue;
    var from=Math.max.apply(null,mem.map(function(x){return Math.min.apply(null,x.windows.filter(function(w){return w.day===day;}).map(function(w){return toMin(w.from);}));}));
    var to=Math.min.apply(null,mem.map(function(x){return Math.max.apply(null,x.windows.filter(function(w){return w.day===day;}).map(function(w){return toMin(w.to);}));}));
    for(var di=0;di<durs.length;di++){
      var dur=durs[di];
      for(var s=from;s+dur<=to;s+=30){
        if(courtsInUse(v.id,day,s,dur)>=v.courts)continue;
        var lvl=Math.round(mem.reduce(function(a,x){return a+x.level;},0)/mem.length);
        var co=S.coaches.filter(function(c){return (!c.venueIds||!c.venueIds.length||c.venueIds.indexOf(v.id)>=0)&&lvl<=coachMax(c)&&coachFree(c.id,day,s,dur);})[0];
        if(!co)continue;
        return {day:day,start:hhmm(s),duration:dur,level:lvl,coachId:co.id,members:mem};
      }
    }
  }
  return null;
}

/* ─────────── storage: the API function ───────────
   The browser no longer touches Data Store. Every read and write goes to one
   Advanced I/O function, which reads the caller's identity from the Catalyst
   session and derives the academy itself. There is no academy id and no slug
   in anything this page sends — so there is nothing here to tamper with. */

var FUNCTION_URL = "https://ylp-academy-manager-20105401867.development.catalystserverless.eu/server/api/execute";

var ACADEMY = null;            /* { id, name, rules, plan, maxClubs, maxUsers } */
var ROLE = null;
var sdk = null;
var COLLS=["venues","coaches","players","classes","requests"];

function sid(v){ return v==null ? null : String(v); }
function num(v){ var n=Number(v); return isNaN(n)?0:n; }

/* init.js loads asynchronously, so poll rather than assume. */
function waitForSdk(timeoutMs){
  var deadline=Date.now()+(timeoutMs||10000);
  return new Promise(function(resolve){
    (function poll(){
      var c=window.catalyst;
      if(c && c.auth && c.auth.isUserAuthenticated) return resolve(c);
      if(Date.now()>deadline) return resolve(null);
      setTimeout(poll,150);
    })();
  });
}

/* Slate and the function sit on different domains, so the call needs an
   absolute URL and an explicit token — a relative path would resolve to Slate
   and a cookie would not travel. */
function api(path, payload){
  if(!sdk) return Promise.reject(new Error("The Catalyst SDK is not loaded."));
  return sdk.auth.generateAuthToken().then(function(t){
    var token=(t&&(t.access_token||(t.content&&t.content.token)))||"";
    var url=FUNCTION_URL, opts={ headers:{ "Authorization":token, "Content-Type":"application/json" } };
    if(payload){ opts.method="POST"; opts.body=JSON.stringify(Object.assign({path:path},payload)); }
    else { opts.method="GET"; url+="?path="+encodeURIComponent(path); }
    return fetch(url,opts).then(function(res){
      return res.text().then(function(txt){
        var body={}; try{ body=txt?JSON.parse(txt):{}; }catch(e){ body={error:txt.slice(0,200)}; }
        if(!res.ok){
          var e=new Error(body.message||body.error||("HTTP "+res.status));
          e.code=body.error; e.status=res.status; throw e;
        }
        return body;
      });
    });
  });
}

function banner(msg){
  var el=document.getElementById("banner");
  if(!el) return;
  if(!msg){ el.className=""; el.innerHTML=""; return; }
  el.className="on";
  el.innerHTML='<strong>Not saved.</strong> '+esc(msg)+
    ' <button data-act="reloadNow">Reload and see what was actually saved</button>';
}
function failed(what,e){
  storage="error";
  var msg=(e&&e.message)||"unknown error";
  banner("Could not "+what+": "+msg+" What you see on screen is not in the database.");
  toast("Save failed"); render();
}

/* ── read ── */
function loadAll(){
  if(!sdk) return Promise.resolve();
  return api("data").then(function(d){
    ACADEMY=d.academy; ROLE=d.role;
    S.academy={ name:d.academy.name, rules:d.academy.rules||{} };
    S.venues=d.venues||[]; S.coaches=d.coaches||[]; S.players=d.players||[];
    S.classes=d.classes||[]; S.requests=d.requests||[];
    if(!UI.venueId&&S.venues.length) UI.venueId=S.venues[0].id;
    storage="on"; banner(null); render();
  });
}

/* ── write ──
   The server assigns ids, so a create must finish before anything references
   it; every one of these returns a promise and the callers that chain creates
   await them. */
function isNew(id){ return !id || !/^\d+$/.test(String(id)); }

function put(coll,obj){
  var list=S[coll],i=-1;
  for(var k=0;k<list.length;k++) if(list[k].id===obj.id) i=k;
  if(i>=0) list[i]=obj; else list.push(obj);
  render();
  if(!sdk){ banner("The Catalyst SDK is not loaded, so nothing can be saved."); return Promise.resolve(obj); }
  return api("save",{collection:coll,record:obj}).then(function(r){
    if(r && r.id){ obj.id=sid(r.id); render(); }
    return obj;
  }).catch(function(e){
    /* The optimistic row is a lie once the write is refused, so resync first —
       then raise the banner, because a successful load clears it. */
    return loadAll().catch(function(){}).then(function(){ failed("save",e); return obj; });
  });
}

function drop(coll,id){
  S[coll]=S[coll].filter(function(x){return x.id!==id;});
  render();
  if(!sdk||isNew(id)) return Promise.resolve();
  return api("delete",{collection:coll,id:id}).catch(function(e){
    return loadAll().catch(function(){}).then(function(){ failed("delete",e); });
  });
}

function saveAcademy(next){
  S.academy=next;
  if(ACADEMY){ ACADEMY.name=next.name; ACADEMY.rules=next.rules||{}; }
  render();
  if(!sdk) return Promise.resolve();
  return api("academy",{name:next.name,rules:next.rules||{}}).catch(function(e){
    return loadAll().catch(function(){}).then(function(){ failed("save",e); });
  });
}

function boot(){
  render();

    if(!c){ storage="nosdk"; booted=true; render(); return; }
    sdk=c; booted=true;
    return sdk.auth.isUserAuthenticated().then(function(){
      return loadAll().catch(function(e){

          "This account is not attached to any academy. Ask your administrator to add you.");

var toastT=null, toastUndoFn=null;
function toast(msg,undoFn){
  var el=document.getElementById("toastEl");
  if(!el){el=document.createElement("div");el.id="toastEl";el.className="toast";document.body.appendChild(el);}
  toastUndoFn=undoFn||null;
  el.innerHTML="";
  var t=document.createElement("span"); t.textContent=msg; el.appendChild(t);
  if(undoFn){
    var b=document.createElement("button");
    b.className="tundo"; b.type="button"; b.textContent="Undo";
    b.onclick=function(){ var f=toastUndoFn; toastUndoFn=null; el.style.display="none"; if(f) f(); };
    el.appendChild(b);
  }
  el.style.display="block";
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.style.display="none";toastUndoFn=null;}, undoFn?6000:2600);
}

/* ── move a class ──
   Rather than let someone drop a class into an impossible slot and then refuse
   it, only offer the slots that already work: a free court, the coach not
   teaching elsewhere, everything else unchanged. */
var MOVE=null;
/* An academy runs on a handful of house times, not on every half hour. Offering
   all 26 is a wall of chips; offering the five they actually use is a choice. */
function houseTimes(k){
  var set={}, out=[];
  S.classes.forEach(function(c){ if(c.venueId===k.venueId) set[c.start]=1; });
  set[k.start]=1;
  for(var t in set) if(set.hasOwnProperty(t)) out.push(t);
  return out.sort(function(a,b){return toMin(a)-toMin(b);});
}
function allTimes(k){
  var out=[];
  for(var m=DAY_START;m+k.duration<=DAY_END;m+=30) out.push(hhmm(m));
  return out;
}
function freeStarts(k,day,all){
  var out=[], times=all?allTimes(k):houseTimes(k);
  times.forEach(function(t){
    if(toMin(t)+k.duration>DAY_END) return;
    if(day===k.day && t===k.start) return;
    var cand={id:k.id,venueId:k.venueId,coachId:k.coachId,day:day,start:t,
      duration:k.duration,level:k.level,capacity:k.capacity,playerIds:k.playerIds};
    if(canSchedule(cand).length===0) out.push(t);
  });
  return out;
}
function movePanel(k){
  var day=(MOVE.day==null?k.day:MOVE.day), all=!!MOVE.all, co=byId(S.coaches,k.coachId);
  var counts=[],i;
  for(i=0;i<7;i++) counts.push(freeStarts(k,i,all).length);
  var slots=freeStarts(k,day,all);
  return '<div class="card pad mt" id="movePanel" style="background:var(--sunken)">'+
    '<div class="row" style="justify-content:space-between"><b>Move this class</b>'+
      '<button class="btn icon" data-act="moveCancel" aria-label="Close move">✕</button></div>'+
    '<p class="tiny muted" style="margin:2px 0 0">Only times with a free court'+(co?' and '+esc(co.name)+' free':"")+
      '. Same length, level and coach.</p>'+
    '<div class="row mt" style="gap:5px">'+
      DAYS.map(function(d,n){
        return '<button class="chip pick'+(n===day?" on":"")+'" data-act="moveDay" data-id="'+n+'"'+(counts[n]?"":" disabled")+
          ' aria-label="'+DAYF[n]+', '+counts[n]+' free">'+d+' <b>'+counts[n]+'</b></button>';
      }).join("")+
    '</div>'+
    (slots.length
      ? '<div class="row mt" style="gap:6px">'+slots.map(function(t){
          return '<button class="chip pick" data-act="moveTo" data-id="'+k.id+'" data-t="'+t+'">'+t+'</button>';
        }).join("")+'</div>'
      : '<div class="note warn mt">Nothing free on '+DAYF[day]+
        (all?'. Try another day, or use Edit to change the coach or club.':' at your usual hours.')+'</div>')+
    '<div class="row mt"><button class="btn sm" data-act="moveAll">'+
      (all?'Only our usual hours':'Show every half hour')+'</button></div>';
}
function showMovePanel(id){
  classDetail(id);
  /* The modal footer is sticky, so scrolling the panel to the container's
     bottom hides it underneath. Clear the footer's height as well. */
  var el=document.getElementById("movePanel"), box=document.getElementById("modalBox");
  if(!el||!box) return;
  var foot=box.querySelector(".mfoot"), pad=(foot?foot.offsetHeight:0)+12;
  var over=el.getBoundingClientRect().bottom-(box.getBoundingClientRect().bottom-pad);
  if(over>0) box.scrollTop+=over;
}

/* ── paste a roster ──
   Academies keep their players in a WhatsApp message or a spreadsheet column.
   One line per player, an optional level after a comma, tab or semicolon. */
function parseRoster(text){
  var r=rules(), mid=Math.round((r.levelMin+r.levelMax)*0.5*2)/2;
  var out={rows:[],bad:[],dupes:[]};
  var seen={};
  S.players.forEach(function(p){ seen[p.name.trim().toLowerCase()]=true; });
  String(text||"").split(/\r?\n/).forEach(function(line,i){
    var raw=line.trim();
    if(!raw) return;
    var parts=raw.split(/\s*[,;\t]\s*|\s{2,}/);
    var name=(parts[0]||"").trim();
    var lvlTxt=(parts[1]||"").trim().replace(",",".");
    if(!name){ out.bad.push({n:i+1,why:"no name",raw:raw}); return; }
    var lvl=mid;
    if(lvlTxt!==""){
      var v=parseFloat(lvlTxt);
      if(isNaN(v)){ out.bad.push({n:i+1,why:'"'+lvlTxt+'" is not a level',raw:raw}); return; }
      if(v<r.levelMin||v>r.levelMax){ out.bad.push({n:i+1,why:"level "+v+" is outside "+r.levelMin+"–"+r.levelMax,raw:raw}); return; }
      lvl=Math.round(v*2)/2;
    }
    var key=name.toLowerCase();
    if(seen[key]){ out.dupes.push(name); return; }
    seen[key]=true;
    out.rows.push({name:name,level:lvl});
  });
  return out;
}
function rosterPreview(){
  var box=document.getElementById("impOut"); if(!box) return;
  var p=parseRoster(mval("impText"));
  if(!p.rows.length&&!p.bad.length&&!p.dupes.length){ box.className="note info mt"; box.textContent="Nothing pasted yet."; return; }
  var bits=[];
  if(p.rows.length) bits.push("<b>"+p.rows.length+" player"+(p.rows.length===1?"":"s")+" ready</b> — "+
    p.rows.slice(0,4).map(function(x){return esc(x.name)+" ("+fmtLvl(x.level)+")";}).join(", ")+(p.rows.length>4?" …":""));
  if(p.dupes.length) bits.push(p.dupes.length+" already on the list, skipped: "+p.dupes.slice(0,4).map(esc).join(", "));
  if(p.bad.length) bits.push("Skipping "+p.bad.length+" line"+(p.bad.length===1?"":"s")+": "+
    p.bad.slice(0,3).map(function(b){return "line "+b.n+" ("+esc(b.why)+")";}).join(", "));
  box.className="note "+(p.bad.length?"warn":p.rows.length?"info":"warn")+" mt";
  box.innerHTML='<div>'+bits.join("<br>")+'</div>';
}

function laneOut(list){
  var out=list.map(function(c){var o={};for(var k in c)o[k]=c[k];return o;}).sort(function(a,b){return toMin(a.start)-toMin(b.start);});
  var lanes=[];
  out.forEach(function(c){
    var li=-1;
    for(var i=0;i<lanes.length;i++){
      var ok=lanes[i].every(function(o){return !overl(toMin(o.start),o.duration,toMin(c.start),c.duration);});
      if(ok){li=i;break;}
    }
    if(li<0){lanes.push([c]);li=lanes.length-1;} else lanes[li].push(c);
    c._lane=li;
  });
  var groups=[];
  out.forEach(function(c){
    var g=null;
    for(var i=0;i<groups.length;i++) if(groups[i].some(function(o){return overl(toMin(o.start),o.duration,toMin(c.start),c.duration);})) {g=groups[i];break;}
    if(g)g.push(c); else groups.push([c]);
  });
  out.forEach(function(c){
    for(var i=0;i<groups.length;i++) if(groups[i].indexOf(c)>=0){
      c._lanes=Math.max.apply(null,groups[i].map(function(o){return o._lane;}))+1;
    }
  });
  return out;
}
function pips(k){
  var n=capOf(k),f=(k.playerIds||[]).length,s="";
  for(var i=0;i<n;i++) s+='<span class="pip'+(i<f?" on":"")+'"></span>';
  return '<div class="pips">'+s+(n-f>0?'<span style="font-size:10px;margin-left:3px;opacity:.9">'+(n-f)+' free</span>':"")+'</div>';
}
function weekGrid(cls){
  var rows=(DAY_END-DAY_START)/30;
  var head='<div class="calhead"><div></div>'+DAYS.map(function(d,i){
    return '<div><div style="font-family:\'Barlow Semi Condensed\',sans-serif;font-weight:700">'+d+'</div><div class="tiny muted">'+cls.filter(function(c){return c.day===i;}).length+'</div></div>';
  }).join("")+'</div>';
  var gut='<div class="gut" style="height:'+rows*ROW+'px">';
  for(var i=0;i<rows;i+=2) gut+='<div class="gutlab" style="top:'+(i*ROW-7)+'px">'+hhmm(DAY_START+i*30)+'</div>';
  gut+='</div>';
  var cols="";
  for(var d=0;d<7;d++){
    var items=laneOut(cls.filter(function(c){return c.day===d;}));
    var col='<div class="daycol" style="height:'+rows*ROW+'px">';
    for(var i2=0;i2<rows;i2++) col+='<div class="hline'+(i2%2?" half":"")+'" style="top:'+(i2*ROW)+'px"></div>';
    items.forEach(function(c){
      var co=byId(S.coaches,c.coachId);
      var top=((toMin(c.start)-DAY_START)/30)*ROW, h=(c.duration/30)*ROW;
      var w=100/c._lanes;
      col+='<button class="ev" data-act="openClassDetail" data-id="'+c.id+'" style="top:'+(top+1)+'px;height:'+(h-3)+'px;left:calc('+(c._lane*w)+'% + 2px);width:calc('+w+'% - 4px);background:'+lvlColor(c.level)+'">'+
        '<b>'+c.start+'</b><i>L'+fmtLvl(c.level)+' · '+esc(co?co.name.split(" ")[0]:"—")+'</i>'+pips(c)+'</button>';
    });
    cols+=col+'</div>';
  }
  return '<div class="cal">'+head+'<div class="calbody">'+gut+cols+'</div></div>';
}

      '<span class="grow"'+(s.ok?' style="opacity:.5"':'')+'><b>'+esc(s.t)+'</b>'+

        card("Minimum to open",r.minPlayersToOpen+" players")+
        card("Coach L1 / L2 / L3","up to "+r.coachCertification[1]+" / "+r.coachCertification[2]+" / "+r.coachCertification[3])+
      '</div>'+
      '<div class="row mt">'+
      /* Sample data is for an empty academy only — mixing invented players into
         real ones is nearly impossible to unpick afterwards. */
      (hasRealData()
        ? '<button class="btn" disabled title="Only available on an empty academy">Load sample data</button>'
        : '<button class="btn" data-act="loadDemo">Load sample data</button>')+
      '<button class="btn" data-act="feedback">Send feedback</button>'+
      '<button class="btn" data-act="signOut">Sign out</button>'+
      '<button class="btn danger" data-act="wipe">Delete all data</button></div>'+
      (hasRealData()?'<div class="tiny muted mt">Sample data can only be loaded into an empty academy, so it never mixes with your own.</div>':"")+
      '<div class="note info mt">'+storageNote()+'</div>'+
      '<div class="row mt" style="gap:7px;align-items:center;opacity:.55">'+
        '<svg viewBox="0 0 120 100" width="17" height="14" aria-hidden="true" focusable="false"><circle cx="60" cy="38" r="21" fill="currentColor"></circle><path d="M14 44 Q60 90 106 44" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"></path></svg>'+
        '<span class="tiny">Bandeja · by YLP Solutions</span></div>'+
    '</div>';
    return h;
  }
  if(UI.sub==="venues"){
    h+=crudHead("Clubs","newVenue","New club");
    h+= S.venues.length? S.venues.map(function(v){
      return '<div class="listrow"><span class="grow"><b>'+esc(v.name)+'</b></span>'+
        '<span class="muted small">'+v.courts+' courts</span>'+
        '<span class="muted small">'+S.classes.filter(function(c){return c.venueId===v.id;}).length+' classes</span>'+
        '<button class="btn icon" data-act="editVenue" data-id="'+v.id+'">✎</button>'+
        '<button class="btn icon" data-act="delVenue" data-id="'+v.id+'">🗑</button></div>';
    }).join("") : '<div class="empty">No clubs yet.</div>';
    return h;
  }
  if(UI.sub==="coaches"){
    h+=crudHead("Coaches","newCoach","New coach");
    h+= S.coaches.length? S.coaches.map(function(c){
      return '<div class="listrow"><span class="grow"><b>'+esc(c.name)+'</b></span>'+
        '<span class="muted small">L'+c.certLevel+' · up to '+coachMax(c)+'</span>'+
        '<span class="muted small">'+((c.venueIds||[]).map(function(i){return (byId(S.venues,i)||{}).name;}).filter(Boolean).join(", ")||"any club")+'</span>'+
        '<button class="btn icon" data-act="editCoach" data-id="'+c.id+'">✎</button>'+
        '<button class="btn icon" data-act="delCoach" data-id="'+c.id+'">🗑</button></div>';
    }).join("") : '<div class="empty">No coaches yet.</div>';
    return h;
  }
  if(UI.sub==="players"){
    h+='<div class="row mb" style="justify-content:space-between">'+
      '<h3 style="font-size:21px">Players · '+S.players.length+'</h3>'+
      '<span class="row" style="gap:6px"><button class="btn sm" data-act="importPlayers">Paste a list</button>'+
      '<button class="btn sm primary" data-act="newPlayer">＋ New player</button></span></div>';
    /* Filtering happens in the DOM rather than through render(), so the field
       keeps focus while you type — which on a phone keyboard matters a lot. */
    if(S.players.length>6)
      h+='<input class="inp mb" id="pq" type="search" placeholder="Search players" autocomplete="off">';
    h+= S.players.length? '<div class="grid g3" id="plist">'+S.players.slice().sort(function(a,b){return a.level-b.level;}).map(function(p){
      return '<div class="listrow" data-pname="'+esc(p.name.toLowerCase())+'">'+lvlTag(p.level,24)+'<span class="grow">'+esc(p.name)+'</span>'+
        '<span class="tiny muted">'+S.classes.filter(function(c){return (c.playerIds||[]).indexOf(p.id)>=0;}).length+'×</span>'+
        '<button class="btn icon" data-act="editPlayer" data-id="'+p.id+'">✎</button>'+
        '<button class="btn icon" data-act="delPlayer" data-id="'+p.id+'">🗑</button></div>';
    }).join("")+'</div><div class="empty hide" id="pnone">Nobody matches that.</div>' : '<div class="empty">No players yet.</div>';
    return h;
  }
  h+=crudHead("Classes","newClass","New class");
  var sorted=S.classes.slice().sort(function(a,b){return a.day-b.day||toMin(a.start)-toMin(b.start);});
  h+= sorted.length? '<div class="card scroll"><table><thead><tr><th>Day</th><th>Time</th><th>Level</th><th>Coach</th><th>Club</th><th>Seats</th><th></th></tr></thead><tbody>'+
    sorted.map(function(k){
      return '<tr><td>'+DAYS[k.day]+'</td><td>'+k.start+'–'+hhmm(endOf(k))+'</td><td>'+lvlTag(k.level,22)+'</td>'+
        '<td>'+esc((byId(S.coaches,k.coachId)||{}).name||"—")+'</td>'+
        '<td class="muted">'+esc((byId(S.venues,k.venueId)||{}).name||"—")+'</td>'+
        '<td>'+(k.playerIds||[]).length+'/'+capOf(k)+'</td>'+
        '<td style="text-align:right;white-space:nowrap"><button class="btn icon" data-act="openClassDetail" data-id="'+k.id+'">👥</button>'+
        '<button class="btn icon" data-act="editClass" data-id="'+k.id+'">✎</button>'+
        '<button class="btn icon" data-act="delClass" data-id="'+k.id+'">🗑</button></td></tr>';
    }).join("")+'</tbody></table></div>' : '<div class="empty">No classes yet.</div>';
  return h;
}
function card(t,v){return '<div class="listrow" style="display:block"><div class="tiny muted">'+esc(t)+'</div><div style="font-family:\'Barlow Semi Condensed\',sans-serif;font-weight:700;font-size:18px">'+esc(v)+'</div></div>';}
function crudHead(title,act,label){
  return '<div class="row mb" style="justify-content:space-between"><h3 style="font-size:21px">'+title+'</h3>'+
    '<button class="btn sm primary" data-act="'+act+'">＋ '+label+'</button></div>';
}
function storageNote(){
  if(storage==="on") return "Saved through the academy API as "+esc(ACADEMY?ACADEMY.name:"this academy")+
    ". Your academy is determined by your login, not by the link.";
  if(storage==="loading") return "Loading…";
  if(storage==="signedout") return "Signed out.";
  if(storage==="blocked") return "This account cannot open an academy right now.";
  if(storage==="nosdk") return "The Catalyst SDK did not load, so nothing is being saved. This page has to be opened from its Slate URL.";
  if(storage==="error") return "Could not reach the academy API, so recent changes may not be saved.";
  return "Connecting…";
}

/* ── drag to reschedule, on the week grid ──
   Phones never see this: the grid is desktop-only, and the Move panel is the
   answer there. Snapping is to the same half hour the grid draws. */
var DRAG=null, dragGuard=false;
function dayCols(){ return Array.prototype.slice.call(document.querySelectorAll(".calbody .daycol")); }
function dragTarget(ev){
  var k=byId(S.classes,DRAG.id), cols=dayCols();
  if(!k||!cols.length) return null;
  var day=DRAG.from.day;
  for(var i=0;i<cols.length;i++){
    var r=cols[i].getBoundingClientRect();
    if(ev.clientX>=r.left&&ev.clientX<r.right){ day=i; break; }
  }
  var cr=cols[day].getBoundingClientRect();
  var span=k.duration/30, last=(DAY_END-DAY_START)/30-span;
  var slot=Math.round((ev.clientY-DRAG.grabY-cr.top)/ROW);
  if(slot<0) slot=0; if(slot>last) slot=last;
  return {day:day,slot:slot,start:hhmm(DAY_START+slot*30)};
}
function dragTip(show,text,x,y){
  var el=document.getElementById("dragTip");
  if(!show){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="dragTip"; el.className="dragtip"; document.body.appendChild(el); }
  el.textContent=text; el.style.left=x+"px"; el.style.top=y+"px";
}
document.addEventListener("pointerdown",function(ev){
  var el=ev.target.closest&&ev.target.closest(".ev");
  if(!el||ev.button) return;
  var k=byId(S.classes,el.dataset.id); if(!k) return;
  DRAG={id:k.id,el:el,x0:ev.clientX,y0:ev.clientY,
    grabY:ev.clientY-el.getBoundingClientRect().top,moved:false,
    from:{day:k.day,start:k.start},to:null};
  try{ el.setPointerCapture(ev.pointerId); }catch(e){}
});
document.addEventListener("pointermove",function(ev){
  if(!DRAG) return;
  if(!DRAG.moved){
    if(Math.abs(ev.clientX-DRAG.x0)<5&&Math.abs(ev.clientY-DRAG.y0)<5) return;
    DRAG.moved=true; DRAG.el.classList.add("dragging");
  }
  var t=dragTarget(ev); if(!t) return;
  DRAG.to=t;
  var cols=dayCols();
  var dx=cols[t.day].getBoundingClientRect().left-cols[DRAG.from.day].getBoundingClientRect().left;
  var dy=(t.slot-(toMin(DRAG.from.start)-DAY_START)/30)*ROW;
  DRAG.el.style.transform="translate("+dx+"px,"+dy+"px)";
  dragTip(true,DAYS[t.day]+" "+t.start,ev.clientX+14,ev.clientY+16);
});
document.addEventListener("pointerup",function(ev){
  if(!DRAG) return;
  var d=DRAG; DRAG=null; dragTip(false);
  d.el.classList.remove("dragging");
  if(!d.moved) return;                 /* a plain click: let it open the class */
  dragGuard=true; setTimeout(function(){dragGuard=false;},0);
  var revert=function(){ d.el.style.transform=""; };
  var t=d.to;
  if(!t||(t.day===d.from.day&&t.start===d.from.start)) return revert();
  var k=clone(byId(S.classes,d.id)); if(!k) return revert();
  k.day=t.day; k.start=t.start;
  var bad=canSchedule(k);
  if(bad.length){ revert(); toast(bad[0]); return; }
  rescheduleTo(k,d.from);
});
document.addEventListener("pointercancel",function(){
  if(DRAG){ DRAG.el.classList.remove("dragging"); DRAG.el.style.transform=""; DRAG=null; dragTip(false); }
});

/* ─────────── events ─────────── */
document.addEventListener("click",function(ev){
  if(dragGuard) return;
  var el=ev.target.closest("[data-act]");
  if(!el) return;
  var fn=A[el.dataset.act];
  if(fn){ ev.preventDefault(); fn(el.dataset.id,el,ev); }
});
/* Typing must not trigger render() — that would blur the field mid-word. */
document.addEventListener("input",function(ev){
  if(ev.target.id==="impText"){ rosterPreview(); return; }
  if(ev.target.id==="pq"){
    var q=ev.target.value.trim().toLowerCase(), shown=0;
    Array.prototype.forEach.call(document.querySelectorAll("[data-pname]"),function(e){
      var hit=!q||e.dataset.pname.indexOf(q)>=0;
      e.style.display=hit?"":"none"; if(hit) shown++;
    });
    var none=document.getElementById("pnone");
    if(none) none.classList.toggle("hide",shown>0);
  }
});
document.addEventListener("change",function(ev){
  var vsel=ev.target.closest("#kVenue");
  if(vsel){
    var sel=document.getElementById("kCoach");
    if(sel){
      var opts=coachOpts(vsel.value);
      sel.innerHTML=opts.map(function(o){return '<option value="'+o.v+'">'+esc(o.t)+'</option>';}).join("");
    }
    return;
  }
  var el=ev.target.closest("[data-bind]");
  if(!el) return;
  var k=el.dataset.bind;
  UI.filters[k]= (k==="minLvl"||k==="maxLvl") ? +el.value : el.value;
  if(UI.filters.minLvl!=null&&UI.filters.maxLvl!=null&&UI.filters.minLvl>UI.filters.maxLvl){
    if(k==="minLvl") UI.filters.maxLvl=UI.filters.minLvl; else UI.filters.minLvl=UI.filters.maxLvl;
  }
  render();
});

boot();
})();
</script>
